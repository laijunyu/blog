<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#board{display:grid;grid-template-columns:repeat(10,36px);grid-template-rows:repeat(10,36px);gap:2px}
.cell{width:36px;height:36px;background:#16213e;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;color:#e94560;cursor:pointer;user-select:none}
.cell.revealed{background:#e94560;color:#1a1a2e}
.cell.mine{background:#e94560}
.cell.flagged{background:#efbb35}
</style>
</head>
<body>
<div id="board"></div>
<script>
const SIZE=10,MINES=15;
let board=[],revealed=[],flagged=[],gameOver=false;
function init(){
board=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
revealed=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
flagged=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
let placed=0;
while(placed<MINES){const r=Math.floor(Math.random()*SIZE),c=Math.floor(Math.random()*SIZE);
if(board[r][c]!=='M'){board[r][c]='M';placed++}}
for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]==='M')continue;
let count=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
const nr=r+dr,nc=c+dc;if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]==='M')count++}board[r][c]=count}
}
function render(){
  const b=document.getElementById('board');b.innerHTML='';
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const cell=document.createElement('div');cell.className='cell';
    if(revealed[r][c]){cell.classList.add('revealed');
    if(board[r][c]==='M'){if(flagged[r][c])cell.textContent='🚩';else cell.textContent='💣';cell.classList.add('mine')}
    else cell.textContent=board[r][c]||'';
    if(board[r][c]===0)cell.textContent=''}
    else if(flagged[r][c]){cell.classList.add('flagged');cell.textContent='🚩'}
    cell.addEventListener('click',e=>{e.preventDefault();
    if(gameOver)return;
    if(flagged[r][c])return;
    reveal(r,c);render()});
    cell.addEventListener('contextmenu',e=>{e.preventDefault();
    if(gameOver||revealed[r][c])return;
    flagged[r][c]=!flagged[r][c];render()});
    b.appendChild(cell)
  }
}
function reveal(r,c){
  if(r<0||r>=SIZE||c<0||c>=SIZE||revealed[r][c]||flagged[r][c])return;
  revealed[r][c]=true;
  if(board[r][c]==='M'){gameOver=true;for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE;j++)if(board[i][j]==='M')revealed[i][j]=true}
  else if(board[r][c]===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)reveal(r+dr,c+dc)
}
init();render();
</script>
</body>
</html>
