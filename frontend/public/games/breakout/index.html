<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打砖块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
canvas{background:#1a1a2e;border:2px solid #e94560}
</style>
</head>
<body>
<canvas id="game" width="480" height="320"></canvas>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let paddle={x:200,y:300,w:80,h:10},ball={x:240,y:280,r:6,dx:3,dy:-3,},bricks=[],score=0,gameOver=false;
for(let r=0;r<5;r++)for(let c=0;c<8;c++){
  if(Math.random()>0.3)bricks.push({x:c*60+5,y:r*20+30,w:50,h:14,alive:true,color:'#'+Math.floor(Math.random()*16777215).toString(16)})
}
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#e94560';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.closePath();
  bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h)}})
}
function update(){
  if(gameOver)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x-ball.r<0||ball.x+ball.r>canvas.width)ball.vx*=-1;
  if(ball.y-ball.r<0)ball.vy*=-1;
  if(ball.y+ball.r>canvas.height){gameOver=true;return}
  if(ball.y+ball.r>paddle.y&&ball.y-ball.r<paddle.y+paddle.h&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){
    let strike=(ball.x-paddle.x)/paddle.w;
    ball.vx=6*(strike-0.5);ball.vy*=-1;ball.y=paddle.y-ball.r
  }
  bricks.forEach(b=>{if(b.alive&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.alive=false;ball.vy*=-1}})
  draw();requestAnimationFrame(update)
}
canvas.addEventListener('touchend',()=>ball.music='2'),canvas.addEventListener('mousemove',e=>{const rect=canvas.getBoundingClientRect();
  paddle.x=Math.max(0,Math.min(canvas.width-paddle.w,e.clientX-rect.left-paddle.w/2))});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect();
  paddle.x=Math.max(0,Math.min(canvas.width-paddle.w,e.touches[0].clientX-rect.left-paddle.w/2))})
draw();update();
</script>
</body>
</html>
