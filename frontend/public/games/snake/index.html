<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
canvas{border:2px solid #16213e}
#score{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#e94560;font-size:20px;font-family:monospace}
</style>
</head>
<body>
<div id="score">分数: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const grid=20,cols=canvas.width/grid,rows=canvas.height/grid;
let snake=[{x:10,y:10}],food={x:15,y:10},dx=1,dy=0,score=0,gameOver=false;
function draw(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#e94560';ctx.fillRect(food.x*grid,food.y*grid,grid-2,grid-2);
snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#0f3460':'#16213e';ctx.fillRect(s.x*grid,s.y*grid,grid-2,grid-2)});}
function loop(){if(gameOver)return;const head={x:snake[0].x+dx,y:snake[0].y+dy};
if(head.x<0||head.x>=rows||head.y<0||head.y>=cols||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver=true;return;}
snake.unshift(head);
if(head.x===food.x&&head.y===food.y){score+=10;document.getElementById('score').textContent='分数: '+score;
food={x:Math.floor(Math.random()*rows),y:Math.floor(Math.random()*cols)};}
else snake.pop();
draw();}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
if(e.key==='ArrowUp'&&dy!==1){dx=0;dy=-1;}else if(e.key==='ArrowDown'&&dy!==-1){dx=0;dy=1;}
else if(e.key==='ArrowLeft'&&dx!==1){dx=-1;dy=0;}else if(e.key==='ArrowRight'&&dx!==-1){dx=1;dy=0;}});
draw();setInterval(update,100);
</script>
</body>
</html>
